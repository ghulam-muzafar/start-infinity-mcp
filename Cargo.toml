[package]
name = "start-infinity-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only Start Infinity MCP connector over stdio"
publish = false

[dependencies]
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "io-std", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
